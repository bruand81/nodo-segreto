org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# JDK 25/26 (l'unico disponibile su questa macchina) rompe il parser di versione Java
# incluso in Kotlin 2.2.20 (IllegalArgumentException su "25.0.2"/"26.0.2"). Forziamo Gradle
# su JDK 21 (installato via `brew install openjdk@21`) solo per le build Android.
org.gradle.java.home=/opt/homebrew/opt/openjdk@21/libexec/openjdk.jdk/Contents/Home
android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
